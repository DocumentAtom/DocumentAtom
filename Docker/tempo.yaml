# Minimal single-binary Tempo config for the DocumentAtom reference observability stack.
# The OTLP receiver listens inside the Docker network only; the collector forwards traces to it.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
